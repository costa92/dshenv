name: DSH compatibility

# make smoke-dsh across DSH versions: the verified version must pass; latest and next only report,
# so a new DSH release shows up here before the version gate is widened for it.
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'extra npm version or dist-tag of @deepseek-ai/dsh to smoke-test'
        required: false

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (DSH ${{ matrix.dsh }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.1.7-rc.2
            informational: false
          - dsh: 0.2.0-rc.2
            informational: false
          - dsh: latest
            informational: true
          - dsh: next
            informational: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/smoke-dsh.sh "${{ matrix.dsh }}" "$RUNNER_TEMP/smoke"
        env:
          # The verified DSH must take the plugin as declared; newer ones may predate the plugin's next peer range.
          SMOKE_ALLOW_PLUGIN_EXEMPTION: ${{ matrix.informational }}

  requested:
    name: smoke (requested DSH)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dsh_version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The input reaches the script through env, so it is never spliced into the shell text.
      - run: scripts/smoke-dsh.sh "$DSH_VERSION" "$RUNNER_TEMP/smoke"
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
